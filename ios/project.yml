name: SampleApp
options:
  bundleIdPrefix: com.dixa.messenger
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
packages:
  DixaMessenger:
    path: .
targets:
  SampleApp:
    type: application
    platform: iOS
    sources:
      - SampleApp
    dependencies:
      - package: DixaMessenger
        product: DixaMessenger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dixa.messenger.sampleapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
schemes:
  SampleApp:
    build:
      targets:
        SampleApp: all
    run:
      config: Debug
